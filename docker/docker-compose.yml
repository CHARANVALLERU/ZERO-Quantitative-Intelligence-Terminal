# ZERO Terminal — full stack
# Run from the repository root:  docker compose -f docker/docker-compose.yml up --build
#
# All paths are relative to THIS file (docker/), so build contexts use `..`.
version: "3.8"

services:
  zero-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zero-backend
    # backend/ is a package (backend/__init__.py), so the app must be imported
    # as backend.main:app from the repository root.
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
      - ../config.py:/app/config.py:ro
      - zero-db:/app/db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/db/terminal.db
      - REDIS_URL=redis://redis:6379/0
      - ZERO_API_KEY=${ZERO_API_KEY:-}
      - TZ=Asia/Kolkata
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - zero-network
    restart: unless-stopped

  zero-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: zero-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - TZ=Asia/Kolkata
    depends_on:
      - zero-backend
    networks:
      - zero-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zero-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zero-network

  nginx:
    image: nginx:alpine
    container_name: zero-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - zero-frontend
      - zero-backend
    networks:
      - zero-network
    restart: unless-stopped

volumes:
  zero-db:
    driver: local
  redis-data:
    driver: local

networks:
  zero-network:
    driver: bridge
