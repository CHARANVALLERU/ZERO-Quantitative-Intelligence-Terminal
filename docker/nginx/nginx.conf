# ZERO Terminal — reverse proxy for the FastAPI backend and Next.js frontend.
# Mounted at /etc/nginx/nginx.conf by docker/docker-compose.yml.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream zero_backend {
        server zero-backend:8000;
    }

    upstream zero_frontend {
        server zero-frontend:3000;
    }

    # WebSocket endpoint used by the market-data stream.
    server {
        listen 80;
        server_name _;

        # The FastAPI health probe lives at /health (not /api/health).
        location = /health {
            proxy_pass         http://zero_backend/health;
            proxy_set_header   Host $host;
        }

        location /api/ {
            proxy_pass         http://zero_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /ws/ {
            proxy_pass         http://zero_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass         http://zero_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
        }
    }
}
