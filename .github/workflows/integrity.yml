name: integrity

# The repo had no CI at all (`.github/` was git-ignored), so every regression
# was found by hand. This runs the fast, offline suites plus the integrity
# audit. Network-dependent modules are not exercised here.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "python-jose[cryptography]" passlib httpx pytest numpy pandas pyarrow python-dotenv pydantic-settings

      - name: Unit + integrity tests
        env:
          ZERO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          ZERO_ENV: test
        run: |
          python -m pytest tests/test_integrity_fixes.py tests/test_aite_core.py tests/test_aite_pipeline.py tests/test_v2_engine.py tests/test_calibrator.py -q

      - name: Integrity audit (fails only on HIGH findings)
        env:
          ZERO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          ZERO_ENV: test
        run: |
          python -m engine.v2 audit > audit.json || true
          python - <<'PY'
          import json, sys
          report = json.load(open("audit.json"))
          highs = [c for c in report["checks"] if not c["ok"] and c["severity"] == "HIGH"]
          print(f"{report['passed']}/{report['total']} checks passed, {len(highs)} HIGH")
          for c in highs:
              print("  HIGH:", c["name"], "-", c["detail"][:120])
          # Data-provenance and API-auth findings are hard failures in CI.
          blocking = [c for c in highs if c["name"].startswith(("api:", "aite:provenance"))]
          sys.exit(1 if blocking else 0)
          PY

  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: AITE book provenance
        run: |
          python -m engine.data_provenance
        continue-on-error: true
